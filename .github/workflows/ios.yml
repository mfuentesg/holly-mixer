name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build Mixit.swiftpm for the iOS simulator
        working-directory: Mixit.swiftpm
        run: |
          xcodebuild -list
          xcodebuild build -quiet \
            -scheme Mixit \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
